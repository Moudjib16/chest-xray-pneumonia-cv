common:
  data_dir: data/raw
  splits_csv: data/splits.csv
  img_size: 224
  seed: 42
  val_fraction: 0.15
  lr_head: 3.0e-4
  lr_backbone: 1.0e-4
  weight_decay: 1.0e-4
  use_class_weights: true
  label_smoothing: 0.05
  early_stopping_patience: 3
  decision_threshold: 0.5

cpu:
  batch_size: 32
  num_workers: 2
  pin_memory: false
  amp: false
  cpu_threads: 10
  epochs: 10

gpu:
  batch_size: 64
  num_workers: 4
  pin_memory: true
  amp: true
  epochs: 20
